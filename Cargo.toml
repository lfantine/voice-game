[package]
name = "voice_recognition_game"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
colored = "3.1.1"
dotenv = "0.15.0"
iced = { version = "0.14.0", features = ["tokio", "canvas"] }
tokio = { version = "1.53.3", features = ["full"] }
tokio-stream = "0.1.19"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
